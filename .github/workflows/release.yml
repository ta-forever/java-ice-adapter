# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version / tag name (e.g. v2026.9.18)'
        required: true
      draft:
        description: 'Create as draft (not downloadable until published)'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:

    runs-on: ubuntu-latest
    container: eclipse-temurin:17-jdk

    steps:
      - uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Checks
        run: ./gradlew --stacktrace -PjavafxPlatform=linux build

      - name: Build Windows Files
        run: |
          ./gradlew -Pversion="${{ inputs.version }}" -PjavafxPlatform=win --stacktrace :ice-adapter:shadowJar

      - name: Build Linux Files
        run: |
          ./gradlew -Pversion="${{ inputs.version }}" -PjavafxPlatform=linux --stacktrace :ice-adapter:shadowJar

      - name: Build No-JavaFX Files
        run: |
          ./gradlew -Pversion="${{ inputs.version }}" -PjavafxPlatform=linux -PjavafxClasspath=compileOnly --stacktrace :ice-adapter:shadowJar

      - name: Create Release and Upload Jars
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            ice-adapter/build/libs/faf-ice-adapter-${{ inputs.version }}-win.jar
            ice-adapter/build/libs/faf-ice-adapter-${{ inputs.version }}-linux.jar
            ice-adapter/build/libs/faf-ice-adapter-${{ inputs.version }}-nojfx.jar
